          description: 'Conflict: duplicate, in use, or not possible in this state'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShortResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShortResponse'
        default:
          description: Unexpected error
    delete:
      summary: Delete a reference entry not in use
      operationId: adminDeleteRefTable
      tags:
      - admin
      parameters:
      - name: tableID
        in: path
        description: tableID
        required: true
        schema:
          $ref: '#/components/schemas/tableID'
      - name: tabKey
        in: query
        description: tabKey
        required: true
        schema:
          $ref: '#/components/schemas/tabKey'
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShortResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShortResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShortResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShortResponse'
        '409':
          description: 'Conflict: duplicate, in use, or not possible in this state'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShortResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShortResponse'
        default:
          description: Unexpected error
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token from POST /token, or from LWW's sign-in (RACF or Entra)
  schemas:
    abendCode:
      type: string
      minLength: 0
      maxLength: 5
      description: Abend code, for example S0C4 or U0100
    accessGroup:
      type: string
      minLength: 0
      maxLength: 8
      description: RACF group of members, from RACFGRP
    activeDeplID:
      type: integer
      description: Deployment running or failed here; 0 = none
    appCode:
      type: string
      minLength: 0
      maxLength: 8
      description: Short code, upper case; ${LWDAPP} in JCL
    appDescription:
      type: string
      minLength: 0
      maxLength: 1000
      description: Description
    appID:
      type: integer
      description: Application key
    appName:
      type: string
      minLength: 0
      maxLength: 60
      description: Name
    approvalCount:
      type: integer
      description: Number of approvals needed; 0 = none
    approvalReq:
      type: string
      minLength: 0
      maxLength: 1
      description: 'Y: deployments need approval'
    approvalsWaiting:
      type: integer
      description: Deployments waiting for my approval
    approvedCount:
      type: integer
      description: Approvals so far
    approverGroup:
      type: string
      minLength: 0
      maxLength: 8
      description: RACF group of approvers, from RACFGRP
    canApprove:
      type: string
      minLength: 0
      maxLength: 1
      description: 'Y: the user may approve here'
    canCancel:
      type: string
      minLength: 0
      maxLength: 1
      description: 'Y: the user may cancel this deployment now'
    canDeploy:
      type: string
      minLength: 0
      maxLength: 1
      description: 'Y: the user may request deployments here'
    canRetry:
      type: string
      minLength: 0
      maxLength: 1
      description: 'Y: the user may retry or continue this deployment now'
    changeNote:
      type: string
      minLength: 0
      maxLength: 255
      description: Why it was changed
    commentText:
      type: string
      minLength: 0
      maxLength: 255
      description: Comment or reason
    createdBy:
      type: string
      minLength: 0
      maxLength: 8
      description: RACF userid
    createdDate:
      type: string
      minLength: 0
      maxLength: 26
      description: Set by DB2
      example: 2026-01-01-00.00.00.000000
    currentDeplID:
      type: integer
      description: Last succeeded deployment; 0 = none
    currentRev:
      type: integer
      description: Revision used by new deployments; 0 = no JCL yet
    currentVersionID:
      type: integer
      description: Version last deployed successfully; 0 = none
    currentVersionName:
      type: string
      minLength: 0
      maxLength: 30
      description: Its name
    ddName:
      type: string
      minLength: 0
      maxLength: 8
      description: DD name
    decision:
      type: string
      minLength: 0
      maxLength: 1
      description: A approve, R reject
    deplID:
      type: integer
      description: Deployment key
    deployedDate:
      type: string
      minLength: 0
      maxLength: 26
      description: When it was deployed
      example: 2026-01-01-00.00.00.000000
    deployerGroup:
      type: string
      minLength: 0
      maxLength: 8
      description: RACF group that may deploy; empty = every member
    deployUser:
      type: string
      minLength: 0
      maxLength: 8
      description: Deploy userid, from DEPLUSER; empty = can't deploy yet
    deplStatus:
      type: string
      minLength: 0
      maxLength: 1
      description: W awaiting approval, J rejected, E expired, Q queued, U running, F failed, S succeeded,
        C cancelled
    email:
      type: string
      minLength: 0
      maxLength: 254
      description: Email address from RACF (WORKATTR WAEMAIL); empty = no mail
    endedDate:
      type: string
      minLength: 0
      maxLength: 26
      description: Ended
      example: 2026-01-01-00.00.00.000000
    envCode:
      type: string
      minLength: 0
      maxLength: 8
      description: Short code, upper case; ${LWDENV} in JCL
    envDescription:
      type: string
      minLength: 0
      maxLength: 1000
      description: Description
    envID:
      type: integer
      description: Environment key; 0 = none
    envName:
      type: string
      minLength: 0
      maxLength: 60
      description: Name
    envState:
      type: string
      minLength: 0
      maxLength: 1
      description: N never deployed, O ok, H possibly half deployed
    eventNo:
      type: integer
      description: Event number
    eventType:
      type: string
      minLength: 0
      maxLength: 1
      description: R requested, A approved, J rejected, Q queued, U started, T retried, K continued, C
        cancelled, E expired, S succeeded, F failed
    expiredCount:
      type: integer
      description: Deployments that waited too long for approval and expired
    fileNo:
      type: integer
      description: Spool file number
    firstLineNum:
      type: integer
      description: Number of the first line in this part
    flushed:
      type: string
      minLength: 0
      maxLength: 1
      description: 'Y: not executed'
    infoMessage:
      type: string
      minLength: 0
      maxLength: 72
      description: Result text
    isAdmin:
      type: string
      minLength: 0
      maxLength: 1
      description: 'Y: administrator'
    isApprover:
      type: string
      minLength: 0
      maxLength: 1
      description: 'Y: in the approver group of at least one environment'
    isMember:
      type: string
      minLength: 0
      maxLength: 1
      description: 'Y: in the access group'
    isOwner:
      type: string
      minLength: 0
      maxLength: 1
      description: 'Y: in the owner group'
    isUsed:
      type: string
      minLength: 0
      maxLength: 1
      description: 'Y: requested for deployment at least once; can''t be changed'
    jcl:
      type: string
      minLength: 0
      maxLength: 32400
      description: 'JCL: UTF-8 text, lines of at most 80 characters separated by LF, at most 300 lines,
        base64 encoded'
      contentEncoding: base64
      contentMediaType: text/plain
    jesJobID:
      type: string
      minLength: 0
      maxLength: 8
      description: JES job ID
    jobMessage:
      type: string
      minLength: 0
      maxLength: 72
      description: Message, for example why the submit failed
    jobName:
      type: string
      minLength: 0
      maxLength: 8
      description: Job name
    jobNo:
      type: integer
      description: Job number in the deployment, 1, 2, ...
    jobRC:
      type: integer
      description: Highest return code; -1 = not known
    jobResult:
      type: string
      minLength: 0
      maxLength: 1
      description: O within the highest RC, H above it, A abend, X submit failed, T no result in time;
        empty = not ended
    jobStatus:
      type: string
      minLength: 0
      maxLength: 1
      description: W waiting, S submitted, D done, F failed, K skipped
    jobTitle:
      type: string
      minLength: 0
      maxLength: 60
      description: Template name at the time of the request
    lastRunID:
      type: integer
      description: Latest run; 0 = none
    lineCount:
      type: integer
      description: Number of lines
    lineNum:
      type: integer
      description: Line number
    location:
      type: string
      minLength: 0
      maxLength: 255
      description: Dataset prefix or USS path; ${LWDLOC} in JCL
    locType:
      type: string
      minLength: 0
      maxLength: 1
      description: D dataset prefix, U USS path
    maxRC:
      type: integer
      description: Highest acceptable return code
    moreDue:
      type: string
      minLength: 0
      maxLength: 1
      description: 'Y: more queued deployments can start: call again'
    moreLines:
      type: string
      minLength: 0
      maxLength: 1
      description: 'Y: there are more lines after this part'
    nextRunID:
      type: integer
      description: Run of the next job, handed to the CICS submit task; 0 = none
    notifyApp:
      type: string
      minLength: 0
      maxLength: 1
      description: 'Y: mail when a deployment of an application I own ends'
    notifyApprove:
      type: string
      minLength: 0
      maxLength: 1
      description: 'Y: mail when an approval waits for me'
    notifyOwn:
      type: string
      minLength: 0
      maxLength: 1
      description: 'Y: mail when my deployment is decided or ends'
    outputStatus:
      type: string
      minLength: 0
      maxLength: 1
      description: W waiting, C collected, N none found, P purged
    ownerGroup:
      type: string
      minLength: 0
      maxLength: 8
      description: RACF group of owners, from RACFGRP
    password:
      type: string
      minLength: 0
      maxLength: 100
      description: RACF passphrase; never logged or stored
    pgmName:
      type: string
      minLength: 0
      maxLength: 8
      description: Program
    procStep:
      type: string
      minLength: 0
      maxLength: 8
      description: Procedure step
    promoGate:
      type: string
      minLength: 0
      maxLength: 1
      description: 'Y: the version must have succeeded in the previous environment'
    reasonCode:
      type: string
      minLength: 0
      maxLength: 2
      description: Reason code
      example: '00'
    requestedBy:
      type: string
      minLength: 0
      maxLength: 8
      description: Requester
    requestedDate:
      type: string
      minLength: 0
      maxLength: 26
      description: Requested
      example: 2026-01-01-00.00.00.000000
    requestNote:
      type: string
      minLength: 0
      maxLength: 255
      description: Why, from the requester
    retCode:
      type: string
      minLength: 0
      maxLength: 2
      description: Return code
      example: '00'
    revision:
      type: integer
      description: Template revision; 0 = current
    runID:
      type: integer
      description: Run key
    runStatus:
      type: string
      minLength: 0
      maxLength: 1
      description: N new, S submitted, E ended, F failed
    skipReason:
      type: string
      minLength: 0
      maxLength: 255
      description: Why the job was skipped
    sortOrder:
      type: integer
      description: Position in the order
    spoolText:
      type: string
      minLength: 0
      maxLength: 32000
      description: 'At most 300 whole lines of output: UTF-8 text, separated by LF, base64 encoded'
      contentEncoding: base64
      contentMediaType: text/plain
    startAfter:
      type: string
      minLength: 0
      maxLength: 26
      description: Requested start; empty in a request = now
      example: 2026-01-01-00.00.00.000000
    startedDate:
      type: string
      minLength: 0
      maxLength: 26
      description: First job submitted
      example: 2026-01-01-00.00.00.000000
    startedDeplID:
      type: integer
      description: Deployment started by this tick; 0 = none
    stepName:
      type: string
      minLength: 0
      maxLength: 8
      description: Step
    stepNo:
      type: integer
      description: Step number
    stepRC:
      type: integer
      description: Return code; -1 = not known or not executed
    stuckCount:
      type: integer
      description: Runs without a result in time, now failed
    submittedDate:
      type: string
      minLength: 0
      maxLength: 26
      description: Submitted
      example: 2026-01-01-00.00.00.000000
    tabKey:
      type: string
      minLength: 0
      maxLength: 8
      description: Key in the list
    tableID:
      type: string
      minLength: 0
      maxLength: 8
      description: 'List: RACFGRP, DEPLUSER or SETTINGS'
    tabValue:
      type: string
      minLength: 0
      maxLength: 255
      description: Value or description
    templateID:
      type: integer
      description: Template key
    templateName:
      type: string
      minLength: 0
      maxLength: 60
      description: Name
    templateRev:
      type: integer
      description: Template revision that was frozen
    templateStatus:
      type: string
      minLength: 0
      maxLength: 1
      description: A active, D deleted
    token:
      type: string
      minLength: 0
      maxLength: 1024
      description: Access token
    truncated:
      type: string
      minLength: 0
      maxLength: 1
      description: 'Y: cut off at the OUTLINES setting'
    updatedBy:
      type: string
      minLength: 0
      maxLength: 8
      description: RACF userid
    updatedDate:
      type: string
      minLength: 0
      maxLength: 26
      description: Set by DB2
      example: 2026-01-01-00.00.00.000000
    userID:
      type: string
      minLength: 0
      maxLength: 8
      description: RACF userid
    username:
      type: string
      minLength: 0
      maxLength: 8
      description: RACF userid
    varDescription:
      type: string
      minLength: 0
      maxLength: 255
      description: What it is for
    varID:
      type: integer
      description: Variable key
    varName:
      type: string
      minLength: 0
      maxLength: 16
      description: Name, A-Z 0-9 _, starting with a letter; not starting with LWD
    varValue:
      type: string
      minLength: 0
      maxLength: 255
      description: Value; never secret
    versionDescription:
      type: string
