openapi: 3.2.0
info:
  version: 1.0.0
  title: LWD API
  description: |
    LWD: deployments of z/OS applications, with approval and RACF access per application.
    Tags give the access level: user (any signed-in user; COBOL checks the role per application and environment), admin, scheduler, job.
servers:
- url: https://t01.yinhdisv.nl:8081/lwdeploy/API/v1
security:
- bearerAuth: []
tags:
- name: public
  description: 'No token: POST /token only'
- name: user
  description: Signed-in user; roles checked in COBOL through FACILITY profiles
- name: admin
  description: Administrator; FACILITY check in COBOL
- name: scheduler
  description: The scheduler's userid only (setting SCHEDUSR), through its own transaction
- name: job
  description: The deploy userids only, from the result step of a deployment job, through their own transaction
paths:
  /token:
    summary: token
    post:
      summary: Sign in with RACF userid and passphrase
      operationId: newAccessToken
      tags:
      - public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewAccessTokenRequest'
      responses:
        '201':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShortResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShortResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShortResponse'
        default:
          description: Unexpected error
      x-LWWProcessingSteps:
        $ref: lwd_2_1.0.0.yaml/paths/~1token/post/x-LWWProcessingSteps
  /me:
